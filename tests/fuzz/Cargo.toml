[package]
name = "av1-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
av1 = { path = "../..", features = ["fuzzing"] }

# Not part of the root package: only this crate may depend on libfuzzer-sys.
[workspace]

[[bin]]
name = "probe"
path = "fuzz_targets/probe.rs"
test = false
doc = false
bench = false

[[bin]]
name = "decode"
path = "fuzz_targets/decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "avif"
path = "fuzz_targets/avif.rs"
test = false
doc = false
bench = false

[[bin]]
name = "simd_lf"
path = "fuzz_targets/simd_lf.rs"
test = false
doc = false
bench = false
