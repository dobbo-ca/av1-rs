name: bench
on:
  workflow_dispatch:
    inputs:
      avx512:
        description: Stop the x86_64 job at once on a runner without AVX-512 (to bench the AVX-512 tier)
        type: boolean
        default: false
  push: { branches: [main] }
permissions:
  contents: read
# A new run waits for the one before it; it never cancels it (a measurement).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  # Not a required check, no gate. The decoders decode the same corpus in one container, so the
  # ratio compares the same machine. GitHub-hosted runners (docs/benchmarks.md): bench on
  # ubuntu-24.04 (x86_64), bench-arm64 on ubuntu-24.04-arm (NEON against scalar and dav1d).
  bench:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { lfs: false }
      - name: CPU
        env:
          NEED: ${{ inputs.avx512 && 'yes' || '' }}
        run: |
          lscpu | grep -E '^(Model name|CPU\(s\))' || true; grep -ow 'avx512[a-z_0-9]*' /proc/cpuinfo | sort -u | tr '\n' ' ' || true; echo
          if [ -n "$NEED" ] && ! grep -qw avx512f /proc/cpuinfo; then
            echo '::error title=No AVX-512::avx512 is set, but this runner has no AVX-512; dispatch again.'
            exit 1
          fi
      - name: Free disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc && df -h /
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: .github/ci/Dockerfile
          target: bench-report
          push: false
          outputs: type=local,dest=bench-out
          build-args: BENCH_RUN=${{ github.run_id }}
          cache-from: type=gha,scope=av1-rs-bench
          cache-to: type=gha,mode=max,scope=av1-rs-bench
      - if: always()
        run: '[ ! -f bench-out/summary.md ] || cat bench-out/summary.md >> "$GITHUB_STEP_SUMMARY"'
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bench
          path: bench-out
          if-no-files-found: ignore
      - run: exit "$(cat bench-out/status)"

  bench-arm64:
    if: ${{ !inputs.avx512 }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { lfs: false }
      - name: Free disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc && df -h /
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: .github/ci/Dockerfile
          target: bench-report
          push: false
          outputs: type=local,dest=bench-out
          build-args: BENCH_RUN=${{ github.run_id }}
          cache-from: type=gha,scope=av1-rs-bench-arm64
          cache-to: type=gha,mode=max,scope=av1-rs-bench-arm64
      - if: always()
        run: '[ ! -f bench-out/summary.md ] || cat bench-out/summary.md >> "$GITHUB_STEP_SUMMARY"'
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bench-arm64
          path: bench-out
          if-no-files-found: ignore
      - run: exit "$(cat bench-out/status)"
