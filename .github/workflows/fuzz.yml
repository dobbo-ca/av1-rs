name: fuzz
on:
  # The 14 standard slots are full; new crates take day x 12:23 UTC (png-rs Wed, exif-rs Sun, av1-rs Thu).
  schedule: [{ cron: '23 12 * * 4' }]
  workflow_dispatch:
    inputs:
      max_total_time:
        description: Seconds per target
        default: '600'
      only:
        description: Run only this target (empty = all; a simd_* target runs in fuzz-arm64 too)
        default: ''
permissions:
  contents: read
# A new run waits for the one before it; it does not cancel it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  plan:
    runs-on: github-arc-runner-set
    outputs:
      targets: ${{ steps.p.outputs.targets }}
      simd: ${{ steps.p.outputs.simd }}
    steps:
      - id: p
        env:
          ONLY: ${{ inputs.only }}
        run: |
          all="probe decode avif simd_lf simd_grain simd_lr simd_cdef simd_ipred simd_itx simd_threads simd_entropy simd_alloc"
          case "$ONLY" in
            '') list=$all ;;
            *) case " $all " in *" $ONLY "*) list=$ONLY ;; *) echo "unknown target $ONLY" >&2; exit 1 ;; esac ;;
          esac
          json() { echo "[$(echo $* | sed 's/[a-z_][a-z_]*/"&"/g; s/" "/","/g')]"; }
          echo "targets=$(json $list)" >> "$GITHUB_OUTPUT"
          # The cross-tier targets, for fuzz-arm64.
          echo "simd=$(json $(for t in $list; do case $t in (simd_*) echo $t ;; esac; done))" >> "$GITHUB_OUTPUT"
  fuzz:
    needs: plan
    runs-on: github-arc-runner-set
    strategy:
      fail-fast: false
      # The ARC runners are shared (kleio CI too): two fuzz jobs at a time, at most.
      max-parallel: 2
      matrix:
        target: ${{ fromJSON(needs.plan.outputs.targets) }}
    timeout-minutes: 60
    env:
      MAX_TOTAL_TIME: ${{ inputs.max_total_time || '600' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { lfs: false }
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.CI_READ_APP_ID }}
          private-key: ${{ secrets.CI_READ_APP_KEY }}
          owner: dobbo-ca
          repositories: isobmff-rs
          permission-contents: read
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          driver: remote
          endpoint: tcp://buildkitd.github-arc.svc.cluster.local:1234
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: .github/ci/Dockerfile
          target: fuzz
          load: true
          push: false
          tags: av1-fuzz:local
          cache-from: type=gha,scope=av1-rs-fuzz
          cache-to: type=gha,mode=max,scope=av1-rs-fuzz
          secrets: |
            gh_token=${{ steps.app.outputs.token }}
      # The corpus is kept between runs: restored here, copied into the container, copied back
      # out and saved, so a run goes on from where the last one stopped. One cache per target.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: corpus
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-
      # docker create + start, not a RUN layer: a BuildKit cache hit would skip the fuzzing.
      # Seeds: the parity corpus (tests/fuzz/seeds, copied in the image build) and the
      # fuzz-grown files; new inputs go to the first corpus dir.
      - run: |
          mkdir -p corpus/${{ matrix.target }}
          docker create --name fuzz -e MAX_TOTAL_TIME -e TARGET=${{ matrix.target }} av1-fuzz:local \
            sh -c 'mkdir -p tests/data/fuzz-grown && cargo +nightly fuzz run --fuzz-dir tests/fuzz $TARGET tests/fuzz/corpus/$TARGET tests/fuzz/seeds tests/data/fuzz-grown -- -max_total_time=$MAX_TOTAL_TIME -timeout=60 -rss_limit_mb=2048 -malloc_limit_mb=512'
          docker cp corpus fuzz:/src/tests/fuzz/
          docker start -a fuzz
      - if: failure() || cancelled()
        run: docker cp fuzz:/src/tests/fuzz/artifacts/${{ matrix.target }} ./crashers
      - if: failure() || cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: crashers-${{ matrix.target }}
          path: crashers
      - if: always()
        run: docker cp fuzz:/src/tests/fuzz/corpus/${{ matrix.target }}/. corpus/${{ matrix.target }}/ || true
      - if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: corpus
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: corpus-${{ matrix.target }}
          path: corpus/${{ matrix.target }}
          retention-days: 14
          if-no-files-found: ignore

  # The cross-tier targets (simd_*) built for aarch64 and run under qemu-user (Dockerfile stage
  # fuzz-arm64), so the NEON tier is compared with scalar. No sanitizer (ASan does not run under
  # qemu-user), so -malloc_limit_mb has no malloc hook here; -rss_limit_mb still holds. It runs
  # after the x86_64 matrix (crash or not), so the shared runners see two fuzz jobs at most.
  fuzz-arm64:
    needs: [plan, fuzz]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.simd != '[]' }}
    runs-on: github-arc-runner-set
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        target: ${{ fromJSON(needs.plan.outputs.simd) }}
    timeout-minutes: 60
    env:
      MAX_TOTAL_TIME: ${{ inputs.max_total_time || '600' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { lfs: false }
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.CI_READ_APP_ID }}
          private-key: ${{ secrets.CI_READ_APP_KEY }}
          owner: dobbo-ca
          repositories: isobmff-rs
          permission-contents: read
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          driver: remote
          endpoint: tcp://buildkitd.github-arc.svc.cluster.local:1234
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: .github/ci/Dockerfile
          target: fuzz-arm64
          load: true
          push: false
          tags: av1-fuzz-arm64:local
          cache-from: type=gha,scope=av1-rs-fuzz-arm64
          cache-to: type=gha,mode=max,scope=av1-rs-fuzz-arm64
          secrets: |
            gh_token=${{ steps.app.outputs.token }}
      # Own corpus cache; a first run starts from the x86_64 corpus of the same target.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: corpus
          key: fuzz-corpus-arm64-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: |
            fuzz-corpus-arm64-${{ matrix.target }}-
            fuzz-corpus-${{ matrix.target }}-
      - run: |
          mkdir -p corpus/${{ matrix.target }}
          docker create --name fuzz -e MAX_TOTAL_TIME -e TARGET=${{ matrix.target }} av1-fuzz-arm64:local \
            sh -c 'mkdir -p tests/fuzz/artifacts/$TARGET && qemu-aarch64 --version && B=tests/fuzz/target/aarch64-unknown-linux-gnu/release/$TARGET && for m in spawn serial normal; do mkdir -p /tmp/c-$m && cp tests/fuzz/corpus/$TARGET/* /tmp/c-$m/ 2>/dev/null; echo "=== DBG phase $m"; AV1_DBG=$m qemu-aarch64 -L /usr/aarch64-linux-gnu $B -artifact_prefix=tests/fuzz/artifacts/$TARGET/ /tmp/c-$m -runs=3000 -max_total_time=420 -timeout=60 -rss_limit_mb=6000 2>&1 | grep -E "DBG|Done|rss_limit|out-of-memory|INITED"; done; echo "=== DBG phase crasher"; qemu-aarch64 -L /usr/aarch64-linux-gnu $B -runs=2000 -rss_limit_mb=6000 tests/fuzz/dbg/crash 2>&1 | grep -E "DBG|Done|out-of-memory" | tail -12; true'
          docker cp corpus fuzz:/src/tests/fuzz/
          docker start -a fuzz
      - if: failure() || cancelled()
        run: docker cp fuzz:/src/tests/fuzz/artifacts/${{ matrix.target }} ./crashers
      - if: failure() || cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: crashers-arm64-${{ matrix.target }}
          path: crashers
      - if: always()
        run: docker cp fuzz:/src/tests/fuzz/corpus/${{ matrix.target }}/. corpus/${{ matrix.target }}/ || true
      - if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: corpus
          key: fuzz-corpus-arm64-${{ matrix.target }}-${{ github.run_id }}
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: corpus-arm64-${{ matrix.target }}
          path: corpus/${{ matrix.target }}
          retention-days: 14
          if-no-files-found: ignore
