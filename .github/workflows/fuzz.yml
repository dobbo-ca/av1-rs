name: fuzz
on:
  # Weekly, Thursday 12:23 UTC.
  schedule: [{ cron: '23 12 * * 4' }]
  workflow_dispatch:
    inputs:
      max_total_time:
        description: Seconds per target
        default: '600'
      only:
        description: Run only this target (empty = all; a simd_* target runs on arm64 too)
        default: ''
permissions:
  contents: read
# A new run waits for the one before it; it does not cancel it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  # One matrix entry per target on x86_64 (ubuntu-24.04), and one more per cross-tier target
  # (simd_*) on aarch64 (ubuntu-24.04-arm), so the NEON tier is compared with scalar. p is the
  # name prefix of the arm64 corpus cache and artifacts.
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.p.outputs.matrix }}
    steps:
      - id: p
        env:
          ONLY: ${{ inputs.only }}
        run: |
          all="probe decode frames_threads avif simd_lf simd_grain simd_lr simd_cdef simd_ipred simd_itx simd_threads simd_entropy simd_alloc"
          case "$ONLY" in
            '') list=$all ;;
            *) case " $all " in *" $ONLY "*) list=$ONLY ;; *) echo "unknown target $ONLY" >&2; exit 1 ;; esac ;;
          esac
          inc=
          for t in $list; do
            inc="$inc{\"target\":\"$t\",\"arch\":\"x86_64\",\"os\":\"ubuntu-24.04\",\"p\":\"\"},"
            case $t in simd_*) inc="$inc{\"target\":\"$t\",\"arch\":\"arm64\",\"os\":\"ubuntu-24.04-arm\",\"p\":\"arm64-\"}," ;; esac
          done
          echo "matrix={\"include\":[${inc%,}]}" >> "$GITHUB_OUTPUT"
  fuzz:
    needs: plan
    name: fuzz ${{ matrix.arch }} ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    timeout-minutes: 60
    env:
      MAX_TOTAL_TIME: ${{ inputs.max_total_time || '600' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { lfs: false }
      - name: Free disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc && df -h /
      # ASan cannot map its shadow memory with the 32-bit mmap randomisation of recent kernels.
      - run: sudo sysctl -w vm.mmap_rnd_bits=28 || true
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: .github/ci/Dockerfile
          target: fuzz
          load: true
          push: false
          tags: av1-fuzz:local
          cache-from: type=gha,scope=av1-rs-fuzz-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=av1-rs-fuzz-${{ matrix.arch }}      # The corpus is kept between runs: restored here, copied into the container, copied back
      # out and saved, so a run goes on from where the last one stopped. One cache per target
      # and architecture; a first arm64 run starts from the x86_64 corpus of the same target.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: corpus
          key: fuzz-corpus-${{ matrix.p }}${{ matrix.target }}-${{ github.run_id }}
          restore-keys: |
            fuzz-corpus-${{ matrix.p }}${{ matrix.target }}-
            fuzz-corpus-${{ matrix.target }}-
      # docker create + start, not a RUN layer: a BuildKit cache hit would skip the fuzzing.
      # Seeds: the parity corpus (tests/fuzz/seeds, copied in the image build) and the
      # fuzz-grown files; new inputs go to the first corpus dir.
      - run: |
          mkdir -p corpus/${{ matrix.target }}
          docker create --name fuzz -e MAX_TOTAL_TIME -e TARGET=${{ matrix.target }} av1-fuzz:local \
            sh -c 'mkdir -p tests/data/fuzz-grown && cargo +nightly fuzz run --fuzz-dir tests/fuzz $TARGET tests/fuzz/corpus/$TARGET tests/fuzz/seeds tests/data/fuzz-grown -- -max_total_time=$MAX_TOTAL_TIME -timeout=60 -rss_limit_mb=2048 -malloc_limit_mb=512'
          docker cp corpus fuzz:/src/tests/fuzz/
          docker start -a fuzz
      - if: failure() || cancelled()
        run: docker cp fuzz:/src/tests/fuzz/artifacts/${{ matrix.target }} ./crashers
      - if: failure() || cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: crashers-${{ matrix.p }}${{ matrix.target }}
          path: crashers
      - if: always()
        run: docker cp fuzz:/src/tests/fuzz/corpus/${{ matrix.target }}/. corpus/${{ matrix.target }}/ || true
      - if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: corpus
          key: fuzz-corpus-${{ matrix.p }}${{ matrix.target }}-${{ github.run_id }}
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: corpus-${{ matrix.p }}${{ matrix.target }}
          path: corpus/${{ matrix.target }}
          retention-days: 14
          if-no-files-found: ignore
