name: ci
on: { pull_request: {}, push: { branches: [main] }, workflow_dispatch: {} }
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # The checks run inside .github/ci/Dockerfile, built with BuildKit (setup-buildx, the default
  # docker-container driver) on GitHub-hosted runners: ubuntu-24.04 for x86_64, ubuntu-24.04-arm
  # for aarch64. The layers are saved to the Actions cache, one scope per job. isobmff-rs is not
  # public: the dobbo-ca-ci-read GitHub App mints a read-only token for it, and it reaches the
  # build only as a BuildKit secret.
  # Fork PRs get no secrets, so no token: every job that needs isobmff-rs is skipped on a fork PR
  # (the job-level `if`), and a skipped job is not a failure.
  # A PR runs `test` (the required check) and `arm64`; parity and parity-arm64 run on main and on
  # workflow_dispatch.
  test:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { lfs: false }
      - name: Create isobmff-rs read token (dobbo-ca-ci-read app)
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.CI_READ_APP_ID }}
          private-key: ${{ secrets.CI_READ_APP_KEY }}
          owner: dobbo-ca
          repositories: isobmff-rs
          permission-contents: read
      - name: Free disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc && df -h /
      # The SIMD tiers the tests reach depend on the CPU (AVX-512 or not).
      - name: CPU
        run: lscpu | grep -E '^(Model name|CPU\(s\))' || true; grep -ow 'avx512[a-z]*' /proc/cpuinfo | sort -u | tr '\n' ' ' || true; echo
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: .github/ci/Dockerfile
          target: ci
          push: false
          outputs: type=cacheonly
          cache-from: type=gha,scope=av1-rs-test
          # Only main and dispatch runs export: a PR's cache is scoped to its ref, so no other PR
          # could read it, and the export takes about two minutes.
          cache-to: ${{ github.event_name != 'pull_request' && 'type=gha,mode=max,scope=av1-rs-test' || '' }}
          secrets: |
            gh_token=${{ steps.app.outputs.token }}

  # Native aarch64: clippy and the whole suite, with the NEON tier and with the scalar tier.
  arm64:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { lfs: false }
      - name: Create isobmff-rs read token (dobbo-ca-ci-read app)
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.CI_READ_APP_ID }}
          private-key: ${{ secrets.CI_READ_APP_KEY }}
          owner: dobbo-ca
          repositories: isobmff-rs
          permission-contents: read
      - name: Free disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc && df -h /
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: .github/ci/Dockerfile
          target: arm64
          push: false
          outputs: type=cacheonly
          cache-from: type=gha,scope=av1-rs-arm64
          cache-to: ${{ github.event_name != 'pull_request' && 'type=gha,mode=max,scope=av1-rs-arm64' || '' }}
          secrets: |
            gh_token=${{ steps.app.outputs.token }}

  # dav1d, aomdec and examples/oracle.rs decode the same public corpus
  # (tests/parity/corpus.txt); every output plane must be equal (tests/parity/run.sh). The
  # stage never fails on a diff: the report is the build output, and the last step fails on its
  # status file.
  parity:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { lfs: false }
      - name: Create isobmff-rs read token (dobbo-ca-ci-read app)
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.CI_READ_APP_ID }}
          private-key: ${{ secrets.CI_READ_APP_KEY }}
          owner: dobbo-ca
          repositories: isobmff-rs
          permission-contents: read
      - name: Free disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc && df -h /
      # The `tiers` gate reaches AVX-512 only on a CPU that has it.
      - name: CPU
        run: lscpu | grep -E '^(Model name|CPU\(s\))' || true; grep -ow 'avx512[a-z]*' /proc/cpuinfo | sort -u | tr '\n' ' ' || true; echo
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: .github/ci/Dockerfile
          target: parity-report
          push: false
          outputs: type=local,dest=parity-out
          cache-from: type=gha,scope=av1-rs-parity
          cache-to: type=gha,mode=max,scope=av1-rs-parity
          secrets: |
            gh_token=${{ steps.app.outputs.token }}
      - if: always()
        run: '[ ! -f parity-out/summary.md ] || cat parity-out/summary.md >> "$GITHUB_STEP_SUMMARY"'
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: parity
          path: parity-out
          if-no-files-found: ignore
      - if: always()
        run: exit "$(cat parity-out/status)"
      # The transform oracle (tests/parity/transform.sh): libheif with dav1d against
      # decode_avif with Options::apply_transforms. Its own report and artifact, the same job.
      - if: always()
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: .github/ci/Dockerfile
          target: transform-report
          push: false
          outputs: type=local,dest=transform-out
          cache-from: type=gha,scope=av1-rs-transform
          cache-to: type=gha,mode=max,scope=av1-rs-transform
          secrets: |
            gh_token=${{ steps.app.outputs.token }}
      - if: always()
        run: '[ ! -f transform-out/summary.md ] || cat transform-out/summary.md >> "$GITHUB_STEP_SUMMARY"'
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: parity-transform
          path: transform-out
          if-no-files-found: ignore
      - if: always()
        run: exit "$(cat transform-out/status)"

  # The same parity gate (run.sh full) natively on aarch64: the NEON tier and the scalar tier
  # against dav1d and aomdec built for arm64.
  parity-arm64:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { lfs: false }
      - name: Create isobmff-rs read token (dobbo-ca-ci-read app)
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.CI_READ_APP_ID }}
          private-key: ${{ secrets.CI_READ_APP_KEY }}
          owner: dobbo-ca
          repositories: isobmff-rs
          permission-contents: read
      - name: Free disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc && df -h /
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: .github/ci/Dockerfile
          target: parity-report
          push: false
          outputs: type=local,dest=parity-out
          cache-from: type=gha,scope=av1-rs-parity-arm64
          cache-to: type=gha,mode=max,scope=av1-rs-parity-arm64
          secrets: |
            gh_token=${{ steps.app.outputs.token }}
      - if: always()
        run: '[ ! -f parity-out/summary.md ] || cat parity-out/summary.md >> "$GITHUB_STEP_SUMMARY"'
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: parity-arm64
          path: parity-out
          if-no-files-found: ignore
      - if: always()
        run: exit "$(cat parity-out/status)"
