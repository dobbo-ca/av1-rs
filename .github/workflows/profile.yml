name: profile
# Where the decoder spends its time (tests/parity/profile.sh), on the bench classes. Dispatch
# only; information for the speed work, not a check.
on:
  workflow_dispatch:
    inputs:
      simd:
        description: AV1_SIMD tier to profile (empty = best available)
        default: ''
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { lfs: false }
      - name: Free disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc && df -h /
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: .github/ci/Dockerfile
          target: profile
          load: true
          push: false
          tags: av1-profile:local
          cache-from: type=gha,scope=av1-rs-profile
          cache-to: type=gha,mode=max,scope=av1-rs-profile      # perf needs perf_event_open, which a BuildKit RUN does not allow; profile.sh falls back
      # to callgrind when perf cannot record here either.
      - env:
          AV1_SIMD: ${{ inputs.simd }}
        run: |
          docker create --privileged --name prof -e AV1_SIMD av1-profile:local sh tests/parity/profile.sh run /report
          docker start -a prof
          docker cp prof:/report prof-out
      - if: always()
        run: '[ ! -f prof-out/summary.md ] || cat prof-out/summary.md >> "$GITHUB_STEP_SUMMARY"'
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: profile
          path: prof-out
          if-no-files-found: ignore
