[package]
name = "av1"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
description = "AV1 intra-only decoder (AVIF stills and key frames), bit-exact to the AV1 specification, with strict resource limits."
publish = false

[dependencies]
isobmff = { git = "https://github.com/dobbo-ca/isobmff-rs", rev = "439720afc00ff988ff8e25fe3b2f932b09e809e2" }

# The tests decode whole frames, so they run optimised; this crate keeps its own overflow checks
# and debug assertions in dev builds.
[profile.test]
opt-level = 2

# One codegen unit, so the decode loops inline across modules.
[profile.release]
codegen-units = 1

[features]
# Exposes `av1::fuzzing` (cross-tier SIMD checks) to the fuzz crate in tests/fuzz. Not for users.
fuzzing = []
